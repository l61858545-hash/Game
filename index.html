<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    
    <!-- NEU: Das Icon (Favicon) gegen den 404 Fehler -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='red'/></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="position: relative;">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Overlay für Game Over und Rangliste -->
        <div id="leaderboardOverlay" class="hidden">
            <h2>Game Over</h2>
            <p>Dein Score: <span id="finalScoreDisplay">0</span></p>
            
            <div id="inputSection">
                <!-- Wrapper für Input und Ändern-Knopf -->
                <div class="input-wrapper">
                    <input type="text" id="playerName" placeholder="Dein Name" maxlength="12">
                    <button id="changePlayerBtn" class="hidden" title="Namen ändern">✎</button>
                </div>
                <button id="submitScoreBtn">Score senden</button>
            </div>

            <h3>Top 10 Rangliste</h3>
            <ul id="leaderboardList">
                <li>Lade Daten...</li>
            </ul>
            
            <p style="margin-top: 20px; font-size: 14px; color: #aaa;">Drücke ENTER zum Neustarten</p>
        </div>
    </div>

    <!-- Skripte -->
    <script src="version_check.js"></script>
    <script src="leaderboard.js"></script>
    <script src="game.js"></script>
</body>
</html>
