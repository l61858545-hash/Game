<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CACHE CONTROL: Zwingt den Browser, nach Updates zu suchen -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Game</title>
    
    <!-- Google Font "Poppins" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Favicon (Rotes Quadrat) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='red'/></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="position: relative;">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Overlay für Game Over und Rangliste -->
        <div id="leaderboardOverlay" class="hidden">
            <h2>GAME OVER</h2>
            <p class="score-label">Dein Score</p>
            <p class="score-value"><span id="finalScoreDisplay">0</span></p>
            
            <div id="inputSection">
                <div class="input-wrapper">
                    <input type="text" id="playerName" placeholder="Dein Name" maxlength="12">
                    <button id="changePlayerBtn" class="hidden" title="Namen ändern">✎</button>
                </div>
                <button id="submitScoreBtn">SCORE SENDEN</button>
            </div>

            <h3>Rangliste</h3>
            <ul id="leaderboardList">
                <li>Lade Daten...</li>
            </ul>
            
            <p class="restart-hint">Drücke <strong>ENTER</strong> zum Neustarten</p>
        </div>
    </div>

    <!-- AUTOMATISCHER UPDATE-ZWANG (Cache Busting) -->
    <script>
        // Wir erstellen einen Zeitstempel
        const version = new Date().getTime();

        // Funktion um Scripts dynamisch zu laden
        function loadScript(src, isModule = false) {
            const script = document.createElement('script');
            script.src = src + "?v=" + version; 
            if (isModule) {
                script.type = "module";
            }
            document.body.appendChild(script);
        }

        // WICHTIG: Wir laden NUR NOCH das Hauptmodul!
        // main.js kümmert sich um den Import aller anderen Dateien aus dem js/ Ordner.
        loadScript("js/main.js", true); 
    </script>
</body>
</html>
