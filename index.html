<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CACHE CONTROL: Zwingt den Browser, nach Updates zu suchen -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Game</title>
    
    <!-- Google Font "Poppins" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Favicon (Rotes Quadrat) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='red'/></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="position: relative;">
        <canvas id="gameCanvas"></canvas>
        
        <!-- NEU: HUD (Heads-Up Display) für Score und Best -->
        <div id="gameHud">
            <!-- Linke Seite: Aktueller Score -->
            <div class="hud-box">
                <span class="hud-label">Score</span>
                <span id="hudScore">0</span>
            </div>

            <!-- Rechte Seite: Highscore & Pre-Update -->
            <div class="hud-right-wrapper">
                <div class="hud-box">
                    <span class="hud-label">Best</span>
                    <span id="hudBest">0</span>
                </div>
                <div id="hudPreUpdate" class="hud-box hidden" style="margin-top: 5px; opacity: 0.7;">
                    <span class="hud-label">Old</span>
                    <span id="hudPreUpdateValue">0</span>
                </div>
            </div>
        </div>

        <!-- Overlay für Game Over und Rangliste -->
        <div id="leaderboardOverlay" class="hidden">
            <h2>GAME OVER</h2>
            <h3>Rangliste</h3>
            <p class="score-label">Dein Score</p>
            <p class="score-value"><span id="finalScoreDisplay">0</span></p>
            
            <div id="inputSection">
                <div class="input-wrapper">
                    <input type="text" id="playerName" placeholder="Dein Name" maxlength="12">
                    <button id="changePlayerBtn" class="hidden" title="Namen ändern">✎</button>
                </div>
                <button id="submitScoreBtn">SCORE SENDEN</button>
            </div>

            <ul id="leaderboardList">
                <li>Lade Daten...</li>
            </ul>
            
            <p class="restart-hint">Drücke <strong>ENTER</strong> zum Neustarten</p>
        </div>
    </div>

    <script>
        // 1. Zeitstempel generieren
        const version = new Date().getTime();

        // 2. Import Map erstellen
        // Hier definieren wir für JEDE Datei, dass sie mit ?v=... geladen werden soll.
        // Das löst das Problem für alle verschachtelten Imports.
        const importMap = {
            "imports": {
                "./js/main.js": `./js/main.js?v=${version}`,
                "./js/config.js": `./js/config.js?v=${version}`,
                "./js/input.js": `./js/input.js?v=${version}`,
                "./js/leaderboard.js": `./js/leaderboard.js?v=${version}`,
                "./js/storage.js": `./js/storage.js?v=${version}`,
                "./js/generator.js": `./js/generator.js?v=${version}`
            }
        };

        // 3. Import Map in den Head schreiben
        const im = document.createElement('script');
        im.type = 'importmap';
        im.textContent = JSON.stringify(importMap);
        document.head.appendChild(im);

        // 4. Das Hauptmodul laden
        // Wir importieren es jetzt über den Pfad, der in der Map definiert ist
        const script = document.createElement('script');
        script.type = 'module';
        // WICHTIG: Hier importieren wir direkt den Pfad aus der Map
        script.textContent = "import './js/main.js';";
        document.body.appendChild(script);
    </script>
</body>
</html>
